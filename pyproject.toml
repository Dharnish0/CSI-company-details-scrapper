[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpdisc"
version = "0.1.0"
description = "Corporate hierarchy discovery (Phase 0 / M0: project foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "tldextract==5.4.0",
    "langgraph==1.2.12",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
playwright = [
    "playwright==1.63.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"corpdisc.db" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "playwright: needs the playwright package and an installed chromium (skipped otherwise)",
    "live: calls a REAL LLM provider (billable). Deselected by default; run with: pytest tests/live -m live",
    "live_site: crawls the REAL target site with a REAL LLM. Deselected by default; also needs CORPDISC_LIVE_SITE=1",
]
addopts = "-m 'not live and not live_site'"
